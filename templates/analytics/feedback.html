<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback - AI Support</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; overflow: hidden; }
        .app-container { display: flex; height: 100vh; }
        .sidebar { width: 280px; background: #1f2937; color: #fff; display: flex; flex-direction: column; padding: 20px; }
        .sidebar h4 { font-size: 1.1rem; font-weight: 600; margin-bottom: 25px; color: #9ca3af; }
        .sidebar a { color: #d1d5db; text-decoration: none; padding: 10px 15px; border-radius: 8px; margin-bottom: 8px; transition: all 0.2s; display: flex; align-items: center; gap: 10px; }
        .sidebar a:hover, .sidebar a.active { background: #374151; color: #fff; }
        .main-content { flex: 1; display: flex; flex-direction: column; background: #f9fafb; overflow-y: auto; }
        .content-header { padding: 20px 30px; background: #fff; border-bottom: 1px solid #e5e7eb; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <h4 class="text-uppercase tracking-wider"><i class="fa-solid fa-graduation-cap me-2"></i>Student Support</h4>
        <div class="flex-grow-1">
            <a href="/chat/"><i class="fa-solid fa-comments"></i> Chat Assistant</a>
            <a href="/analytics/feedback/" class="active"><i class="fa-solid fa-pen-to-square"></i> Submit Feedback</a>
            <a href="/admin/" target="_blank"><i class="fa-solid fa-shield-halved"></i> Admin Panel</a>
        </div>
        <div class="text-muted small text-center pt-3 border-top border-secondary">
            <i class="fa-solid fa-circle text-success fs-6 me-1"></i> System Online
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        <div class="content-header">
            <h4 class="fw-bold m-0 text-dark"><i class="fa-solid fa-pen-to-square text-primary me-2"></i>Submit Feedback & Report Difficult Topics</h4>
        </div>
        
        <div class="container p-5" style="max-width: 700px;">
            <div class="card shadow-sm border-0 p-4 rounded-4 bg-white">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Rating (1 to 5):</label>
                        <select name="rating" class="form-select py-2" required>
                            <option value="5">⭐ 5 - Excellent</option>
                            <option value="4">⭐ 4 - Good</option>
                            <option value="3">⭐ 3 - Average</option>
                            <option value="2">⭐ 2 - Poor</option>
                            <option value="1">⭐ 1 - Very Poor</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Difficult Topic (if any):</label>
                        <input type="text" name="difficult_topic" class="form-control py-2" placeholder="e.g., Vector embeddings or Django routing">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Comments / Suggestions:</label>
                        <textarea name="comments" class="form-control" rows="4" placeholder="How can we improve your learning experience?"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">Submit Feedback</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
